services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'WARN'
    volumes:
      - ./kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internalNet

  apigw:
    image: nginx
    container_name: gateway
    ports:
      - '8080:80'
    depends_on:
      - data
      - user
    environment:
      - JWT_SECRET=22d7bfbf2a5c1afc744f60f3af98c5b1f3b3e5699a88821882e175e4e01decfc
    volumes:
      - ./nginx/configs/routing.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dataNet
      - userNet
      - internalNet #per comunicare con SLABreachDetector

  # --- MODIFICA 1: Aggiornamento variabili AlertSystem ---
  alertsystem:
    build:
      context: .
      dockerfile: AlertSystem/Dockerfile
    container_name: alertSystem
    depends_on:
      kafka:
        condition: service_started
      data: # Lasciato esattamente come nel tuo file originale
        condition: service_started
    environment:
      - KAFKA_HOST=kafka:9092
      # Variabili aggiornate per il codice nuovo
      - TOPIC_FLIGHTS=to-alert-system
      - TOPIC_SLA=sla-breach-topic
      - OUTPUT_TOPIC=to-notifier
      # Variabili originali
      - DB_HOST=dataDB
      - DB_NAME=mysqldataDB
      - MYSQL_ROOT_PASSWORD=ermenegildo
      - PYTHONUNBUFFERED=1
    networks:
      - dataNet
      - internalNet

  # --- MODIFICA 2: Aggiornamento variabili AlertNotifier ---
  alertnotifier:
    build:
      context: .
      dockerfile: AlertNotifierSystem/Dockerfile
    container_name: alertNotifier
    depends_on:
      kafka:
        condition: service_started
    environment:
      - KAFKA_HOST=kafka:9092
      - INPUT_TOPIC=to-notifier
      - PYTHONUNBUFFERED=1
      # Configurazione Email (Sostituisci o usa .env)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${GMAIL_USER}
      - SMTP_PASSWORD=${GMAIL_APP_PASSWORD}
      - SENDER_NAME=DSBD Alert System
    networks:
      - internalNet

  # --- MODIFICA 3: Aggiunto SLA Detector ---
  sla-detector:
    build:
      context: ./SLABreachDetector # Assicurati di aver corretto il Dockerfile nella cartella come detto prima
      dockerfile: Dockerfile
    container_name: slaDetector
    ports:
      - "5000:5000" # Esposto per Postman
    depends_on:
      kafka:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      - KAFKA_HOST=kafka:9092
      - KAFKA_TOPIC=sla-breach-topic
      - PROMETHEUS_URL=http://prometheus:9090
      - CHECK_INTERVAL=20
      - PYTHONUNBUFFERED=1
    volumes:
      - ./SLABreachDetector/sla_config.json:/app/sla_config.json
    networks:
      - internalNet

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - internalNet

  dataDB:
    image: mysql:latest
    container_name: dataDB
    command: --innodb-use-native-aio=0 # Disabilita AIO nativo: il file system di Windows non lo supporta nei volumi Docker
    ports:
      - "3310:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ermenegildo
      - MYSQL_DATABASE=mysqldataDB
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - dataNet
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -permenegildo || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  userDB:
    image: mysql:latest
    container_name: userDB
    command: --innodb-use-native-aio=0  # Disabilita AIO nativo: il file system di Windows non lo supporta nei volumi Docker
    ports:
      - "3311:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=pasquale
      - MYSQL_DATABASE=mysqluserDB
    volumes:
      - ./mysql_user:/var/lib/mysql
    networks:
      - userNet
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -ppasquale || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  data:
    build:
      context: .
      dockerfile: DataCollector/Dockerfile
    container_name: dataCollector
    depends_on:
      kafka:
        condition: service_started
      dataDB:
        condition: service_healthy

    environment:
      - TARGET_GRPC_HOST=userManager
      - TARGET_GRPC_PORT=50051
      - DB_HOST=dataDB
      - DB_NAME=mysqldataDB
      - MYSQL_ROOT_PASSWORD=ermenegildo
      - PYTHONUNBUFFERED=1
    networks:
      - dataNet
      - internalNet

  user:
    build:
      context: .
      dockerfile: UserManager/Dockerfile
    container_name: userManager
    depends_on:
      userDB:
        condition: service_healthy
    environment:
      - GRPC_PORT=50051
      - DB_HOST=userDB
      - DB_NAME=mysqluserDB
      - MYSQL_ROOT_PASSWORD=pasquale
    networks:
      - userNet
      - internalNet

networks:
  dataNet:
  userNet:
  internalNet:
    driver: bridge