apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - port: 9092
      name: internal
    - port: 29093
      name: controller
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        network: data-net
    spec:
      enableServiceLinks: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.28
          command: [ "sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data && chmod 777 /var/lib/kafka/data" ]
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092" # Nota: usiamo il nome del Service K8s
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: datadb
spec:
  ports:
    - port: 3306
  selector:
    app: datadb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadb
spec:
  selector:
    matchLabels:
      app: datadb
  template:
    metadata:
      labels:
        app: datadb
        network: data-net
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: ermenegildo
            - name: MYSQL_DATABASE
              value: mysqldataDB
          volumeMounts:
            - name: mysql-data-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data-storage
          persistentVolumeClaim:
            claimName: datadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: userdb
spec:
  ports:
    - port: 3306
  selector:
    app: userdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userdb
spec:
  selector:
    matchLabels:
      app: userdb
  template:
    metadata:
      labels:
        app: userdb
        network: user-net
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: pasquale
            - name: MYSQL_DATABASE
              value: mysqluserDB
          volumeMounts:
            - name: mysql-user-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-user-storage
          persistentVolumeClaim:
            claimName: userdb-pvc